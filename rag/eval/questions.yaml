# Test questions for "Ask the data", with their correct answers.
#
# Types:
#   value  - one number; correct when within `tolerance` of `expected`
#   list   - names; correct when the answer lists exactly these, in this order
#   refuse - the data can't answer it; correct when the reply is "not available in this data"
#
# Every expected value was produced by running SQL against the committed seed data.
# The first 18 come from docs/validation-log.md, where SQL and Power BI agree.
# Percentages are 0-100. expected_cards names the knowledge cards that should be retrieved.

# --- Validated slices (docs/validation-log.md) ---

- id: otif_overall
  question: What is our OTIF?
  type: value
  expected: 43.97
  tolerance: 0.01
  expected_cards: ["OTIF %"]

